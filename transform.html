<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .a{
        width: 120px;
        height: 120px;
        background-color: yellow;
        transform: rotate(20deg);
      }
        .b{
        width: 120px;
        height: 50px;
        background-color: yellow;
        transform: skewY(20deg);
      }
       .c{
        width: 120px;
        height: 50px;
        background-color: yellow;
        transform: scale(1.5);
      }
       .d{
        width: 120px;
        height: 50px;
        background-color: yellow;
        transform: TranslateX(100%);
      }      
    </style>
<body>
    <h2>transfrom: rotate(20deg)</h2>
    <div class="a">rotate - xoay</div>
    <h2>transfrom: skewY(20deg)</h2>
    <div class="b">skewY - Nghiêng</div>
    <h2>transfrom: scale(1.5)</h2>
    <div class="c">scale - Phóng to</div>
    <h2>transfrom: TranslateX(100%)</h2>
    <div class="d">TranslateX - Phóng to</div>
</body>
</body>
</html>
